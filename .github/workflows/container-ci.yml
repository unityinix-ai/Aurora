name: Aurora Container CI
on:
  push:
    paths:
      - 'api/**'
      - 'security/**'
      - 'well/**'
      - 'personas/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.github/workflows/container-ci.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'security/**'
      - 'well/**'
      - 'personas/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.github/workflows/container-ci.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build API container
        run: docker build --tag aurora-api:ci .
