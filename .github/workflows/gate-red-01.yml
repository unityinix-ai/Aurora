name: GATE-RED-01

on:
  push:
    paths:
      - "security/**"
      - "tests/**"
      - ".github/workflows/gate-red-01.yml"
  pull_request:
    paths:
      - "security/**"
      - "tests/**"
      - ".github/workflows/gate-red-01.yml"

permissions:
  contents: read

jobs:
  gate-policy-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed gate policy tests
        run: python -m unittest discover -s tests -v
